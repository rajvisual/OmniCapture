<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="100%" stop-color="#0e1b2e"/>
    </linearGradient>

    <!-- Core Lens Gradient -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Outer Ring Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" stroke="#162942" stroke-width="2"/>

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#00d2ff" stroke-width="4" stroke-opacity="0.25" filter="url(#cyanGlow)"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#00d2ff" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Target corner brackets (Screen capture HUD style) -->
  <path d="M 112 152 L 112 112 L 152 112" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 360 112 L 400 112 L 400 152" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 112 360 L 112 400 L 152 400" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 360 400 L 400 400 L 400 360" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer camera chassis ring -->
  <circle cx="256" cy="256" r="124" fill="none" stroke="#0066ff" stroke-width="7"/>

  <!-- Core lens element -->
  <circle cx="256" cy="256" r="88" fill="url(#lensGrad)"/>

  <!-- Pupil / Sensor core -->
  <circle cx="256" cy="256" r="42" fill="#080e18"/>

  <!-- Specular highlight reflection -->
  <ellipse cx="232" cy="230" rx="18" ry="11" transform="rotate(-30 232 230)" fill="#ffffff" fill-opacity="0.75"/>

  <!-- Recording active dot -->
  <circle cx="360" cy="152" r="14" fill="#ff3b30"/>
  <circle cx="360" cy="152" r="20" fill="none" stroke="#ff3b30" stroke-width="2" stroke-opacity="0.4"/>
</svg>
